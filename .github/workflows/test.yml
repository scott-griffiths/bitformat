name: Test

on:
  push:
    branches: [stable, main]
  pull_request:
    branches: ['**']

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test ${{ matrix.os.name }} ${{ matrix.python.name }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: linux
            runs-on: ubuntu-latest
          - name: macos
            runs-on: macos-14
          - name: windows
            runs-on: windows-latest
        python:
          - name: CPython 3.11
            action: '3.11'
          - name: CPython 3.12
            action: '3.12'
          - name: CPython 3.13
            action: '3.13'
          - name: CPython 3.14
            action: '3.14'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python.action }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.4"

      - name: Test
        run: ./build.sh
